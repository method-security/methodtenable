types:
  # ENUMs
  assetType:
    enum:
      - HOST
      - WEBAPP
  sourceType:
    enum:
      - AWS
      - NESSUS_AGENT
      - PVS
      - NESSUS_SCAN
      - WAS
  # Config
  VmAssetExportConfig:
    properties:
      chunkSize: integer
      createdAt: optional<string>
      updatedAt: optional<string>
      lastAssessed: optional<string>
      deletedAt: optional<string>
      betweenUpdatedAt: optional<string>
      terminatedAt: optional<string>
      tags: optional<list<string>>
      sources: optional<list<sourceType>>
      types: optional<list<assetType>>
      ipv4s: optional<list<string>>
      hostnames: optional<list<string>>
      operatingSystems: optional<list<string>>
      publicipaddressesonly: boolean
      hasAgent: boolean
      servicenowSysid: boolean
      maxWaitTime: integer
      sleepTime: integer
      timeout: integer
      hideRawOutput: boolean
  # Intermediate Structures
  Asset:
    properties:
      ipaddress: string
      fqdns: optional<list<string>>
      operatingSystems: optional<list<string>> # List for now
      installedSoftware: optional<list<string>>
  AssetList:
    properties:
      assets: optional<list<Asset>>
  AssetDetails:
    properties:
      export_uuid: string
      assets: AssetList
      raw: optional<unknown>
  AssetExportResult:
    properties:
      result: optional<AssetDetails>
  # Report
  VmAssetExportReport:
    properties:
      result: AssetExportResult
      errors: optional<list<string>>
      config: VmAssetExportConfig