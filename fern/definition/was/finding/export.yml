imports:
  common: ../../common.yml
types:
  WasHttpMethod:
    enum:
      - GET
      - POST
      - PUT
      - DELETE
      - HEAD
      - OPTIONS
      - PATCH
      - CONNECT
      - TRACE
  # Config
  WasFindingsExportConfig:
    properties:
      severity: optional<list<common.Severity>>
      includeUnlicensed: boolean
      numAssets: optional<integer>
      since: optional<string>
      firstFound: optional<string>
      lastFixed: optional<string>
      lastFound: optional<string>
      betweenSince: optional<string>
      maxWaitTime: integer
      sleepTime: integer
      timeout: integer
      hideRawOutput: boolean
  # Intermediate Structures
  WasFinding:
    properties:
      name: string
      description: string
      details: optional<string>
      severity: optional<common.Severity>
      state: optional<common.State>
      cve: optional<list<string>>
      cpe: optional<list<string>>
  WasAsset:
    properties:
      url: string
      httpMethod: optional<WasHttpMethod>
      fqdn: optional<string>
      ipv4: optional<string>
      ipv6: optional<string>
  WasFindingInfo:
    properties:
      finding: WasFinding
      asset: WasAsset
  WasFindingList:
    properties:
      findings: optional<list<WasFindingInfo>>
  WasFindingDetails:
    properties:
      export_uuid: string
      findings: WasFindingList
      raw: optional<unknown>
  WasFindingsExportResult:
    properties:
      result: optional<WasFindingDetails>
  # Report
  WasFindingsExportReport:
    properties:
      result: WasFindingsExportResult
      errors: optional<list<string>>
      config: WasFindingsExportConfig